name: Daily submission

on:
  # workflow_dispatch only -- ops/trigger/'s Cloudflare Worker is the sole
  # timekeeper (three slots: 10:40, 11:15, 11:40 Europe/Berlin, spec 6.7.3
  # section 2.2), same pattern as maintain_store.yml. The trigger passes
  # nominal_slot/is_last_slot_of_day as dispatch inputs (ops/trigger/src/
  # index.ts::SLOTS) -- it already knows which slot it meant to fire, so
  # this workflow no longer re-derives that from its own wall-clock start
  # time (spec 6.7.2's derivation trusted the job to still be running
  # inside its intended slot's window, which a run queued behind a slow
  # maintain_store.yml -- the whole reason for section 2.1's soft budget --
  # is no longer guaranteed to do). Defaults cover a manual dispatch with
  # no inputs (e.g. an ad-hoc debug run): a generic, never-red label,
  # matching scripts/run_daily_submission.py::main()'s own pre-existing
  # environment-variable defaults.
  workflow_dispatch:
    inputs:
      mode:
        description: "'scheduled' (default, obeys the ARENA_LIVE switch) or 'smoke' -- a one-off real baseline submission for D+2, sent unconditionally, used exactly once before the live switch is ever flipped on (spec 6.7.3 section 2.5)."
        required: false
        default: "scheduled"
      nominal_slot:
        description: "Which of today's submission slots this run represents (spec 6.7.3 section 2.2)."
        required: false
        default: "manual"
      is_last_slot_of_day:
        description: "Whether this is the day's last submission attempt -- only the last slot's own silence turns the run red (spec 6.7.2 section 2.7). 'true' or 'false'."
        required: false
        default: "false"

concurrency:
  # Shares maintain_store.yml's own group (spec section 3.2: "gemeinsame
  # concurrency-Gruppe mit dem Pflege-Workflow") -- a submission run must
  # never read the store while a maintenance run is mid-write, and the
  # slot order (Pflege 10:10 -> Einreichung 10:40 -> ...) already relies on
  # runs never overlapping. cancel-in-progress: false, not true: a
  # cancelled-mid-run submission would leave the protocol/payload write
  # half done.
  group: maintain-store
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  submit:
    runs-on: ubuntu-latest
    # The renewables walk-forward alone is measured at ~2.5 minutes (spec
    # section 2.9); generous headroom above that plus the feature build,
    # price fit, and store download, without audit.yml's old 360-min
    # default (CLAUDE.md "Provenance" section).
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      # No ENTSOE_API_KEY (spec section 3.4 -- a property this job's own "no
      # fetch client" test enforces, not just an omission here): the job reads
      # the store and the on-disk weather/commodity caches only. GITHUB_TOKEN
      # downloads the store release asset (ops/release_assets.py) and pushes
      # the protocol/payload commit below. ARENA_API_KEY/ARENA_API_BASE_URL are
      # for the one read-only catalog call (arena/catalog.py::get_challenge) and,
      # once ARENA_LIVE is on (or mode=smoke), the actual POST. ARENA_LIVE is a
      # repository VARIABLE, not a secret (spec section 2.3 -- it must be
      # flippable from the GitHub UI without a commit, the kill switch); unset
      # or anything other than the literal "true" keeps main() in dry-run
      # (arena/config.py::is_live_enabled(), fail-safe by design). mode=smoke
      # bypasses ARENA_LIVE entirely (scripts/run_daily_submission.py::main()).
      - name: Run the daily submission job
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARENA_API_KEY: ${{ secrets.ARENA_API_KEY }}
          ARENA_API_BASE_URL: ${{ vars.ARENA_API_BASE_URL }}
          ARENA_LIVE: ${{ vars.ARENA_LIVE }}
          MODE: ${{ inputs.mode }}
          NOMINAL_SLOT: ${{ inputs.nominal_slot }}
          IS_LAST_SLOT_OF_DAY: ${{ inputs.is_last_slot_of_day }}
        run: uv run python scripts/run_daily_submission.py

      # Same push discipline as maintain_store.yml/audit.yml (spec section
      # 3.1 point 4): a run that measured and then discarded its own
      # protocol line and payload would defeat the point of this step
      # (spec section 5.7 -- logs/submissions.jsonl is 6.8's own input
      # artefact).
      - name: Commit and push the submission protocol and payload
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/submissions.jsonl logs/submission_payloads/

          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "data: submission run $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          for attempt in 1 2 3; do
            if git push; then
              echo "Push succeeded on attempt $attempt."
              exit 0
            fi
            echo "Push failed (attempt $attempt/3); pulling --rebase and retrying."
            git pull --rebase
          done

          echo "::error::Push failed after 3 attempts -- protocol/payload were computed but not saved."
          exit 1
