name: Maintain data store

on:
  # workflow_dispatch only (spec 6.7.1, section 3.2/5.1) -- no schedule:
  # block. GitHub's own schedule trigger measured a median dispatch delay
  # of +242min (max +693min, docs/cron_jobs.md section 2); the external
  # trigger under ops/trigger/ is the sole timekeeper for this workflow,
  # calling this exact dispatch endpoint from well-timed local slots (see
  # ops/trigger/src/index.ts's own SLOTS table for the current schedule).
  #
  # sync_mode input (docs/bugs_in_live_system.md entry 6, 2026-10-01): a
  # real near-miss on this job's hard timeout (1085s "Sync the data store"
  # against a then-20-minute limit) root-caused to a live API cache-miss
  # cascade for cross_border_flows -- a source fully carried and read by no
  # live code (SourceExpectation.relevant_only_eligible). The trigger passes
  # 'relevant-only' for the four gate-closure-adjacent maintenance passes
  # (10:10/10:55/11:25/11:45 Europe/Berlin), which skips that source (and
  # the two others like it) entirely; 'all' for the two passes outside that
  # window (09:00, 18:30), which keeps the store fully current, just
  # time-shifted away from the submission-critical hours. A manual dispatch
  # with no input, or any trigger slot that predates this change, gets
  # 'all' -- the only behavior that ever existed before today.
  workflow_dispatch:
    inputs:
      sync_mode:
        description: "'all' (every source) or 'relevant-only' (skips carried, live-code-unread sources)"
        required: false
        default: "all"
        type: string

concurrency:
  # Two overlapping maintenance runs must never write the store at the same
  # time (spec section 2.2, "Auflage" -- last-write-wins would silently
  # lose one run's work, and that failure mode is invisible in every metric
  # this project measures). cancel-in-progress: false, not true: a
  # cancelled-mid-write run would be worse than a queued one.
  group: maintain-store
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  maintain:
    runs-on: ubuntu-latest
    # A full ENTSO-E gap fetch across six fetch groups plus commodities and
    # one weather run is normally a handful of minutes; generous headroom
    # without being audit.yml's old 360-min default (same reasoning as
    # audit.yml's own timeout-minutes, CLAUDE.md "Provenance" section).
    #
    # Per-mode expression (docs/bugs_in_live_system.md entry 6, 2026-10-01):
    # sync_mode=all's own worst observed "Sync the data store" step, sampled
    # across all 40 real runs from 2026-09-25 to 2026-10-01, was 1085s --
    # only ~115s clear of the single 20-minute limit this job used to have
    # unconditionally. 40 minutes leaves that worst case well over 50%
    # headroom (see SYNC_SOFT_BUDGET_SECONDS_ALL's own derivation comment in
    # scripts/sync_store.py for the full numbers). relevant-only keeps the
    # original 20-minute limit unchanged -- it skips exactly the sources
    # that produced every one of the slow runs in that sample.
    timeout-minutes: ${{ inputs.sync_mode == 'all' && 40 || 20 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      # ENTSOE_API_KEY for the six ENTSO-E fetch groups; GITHUB_TOKEN
      # (built-in, permissions: contents: write above) for release assets
      # and the log commit below. STORE_ENCRYPTION_KEY (publication spec
      # section 2.1) decrypts the downloaded store and encrypts the one this
      # run publishes -- this is the only workflow besides submit.yml that
      # reads or writes the store, so it is the only other place this secret
      # is bound.
      - name: Sync the data store
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STORE_ENCRYPTION_KEY: ${{ secrets.STORE_ENCRYPTION_KEY }}
        run: uv run python scripts/sync_store.py --mode ${{ inputs.sync_mode }}

      # Same push discipline as audit.yml/weather_availability_probe.yml
      # (spec section 3.1 point 4): a maintenance run that measures and
      # then discards its own log is worse than none.
      - name: Commit and push the sync log
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/store_sync.csv

          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "data: store sync run $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          for attempt in 1 2 3; do
            if git push; then
              echo "Push succeeded on attempt $attempt."
              exit 0
            fi
            echo "Push failed (attempt $attempt/3); pulling --rebase and retrying."
            git pull --rebase
          done

          echo "::error::Push failed after 3 attempts -- sync log was computed but not saved."
          exit 1
