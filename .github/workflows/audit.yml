name: Daily availability audit

on:
  # schedule: removed 2026-09-09 (spec 6.7.1, Entscheidung 20): the
  # Cloudflare Worker under ops/trigger/ is now the sole timekeeper,
  # calling workflow_dispatch from well-timed local slots (09:30 and 11:30
  # Europe/Berlin). GitHub's own schedule: trigger measured a median
  # dispatch delay of +242min (max +693min) since 2026-08-27 -- the exact
  # drift problem the temporary duplicate-slot crons below were bolted on
  # to work around; both the original four-slot schedule and that
  # workaround are now moot. docs/sprint6_step6_7_1_log.md, "Nachtrag A2".
  workflow_dispatch: {}

concurrency:
  group: availability-audit
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    # GitHub's default is 360 min -- a stalled network call with no client-side
    # timeout hung for 6h on 2026-08-25 and, via the concurrency group below,
    # cascaded into 3 skipped cron runs. 20 min is generous for a job whose own
    # steps normally finish in well under 5.
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      # ENTSOE_API_KEY only -- this step never touches the Arena API, so it
      # cannot submit anything even with a bug (spec §4.5, §5.4).
      - name: Run availability audit (ENTSO-E + Yahoo Finance)
        env:
          ENTSOE_API_KEY: ${{ secrets.ENTSOE_API_KEY }}
        run: uv run python scripts/audit_availability.py --part availability

      # ARENA_API_KEY only -- this step never sees ENTSOE_API_KEY (spec
      # §4.5, §5.4). ARENA_API_BASE_URL is not secret but lives in the same
      # place arena/catalog.py reads all three from.
      - name: Fetch challenge catalog snapshot (Energy Arena)
        env:
          ARENA_API_KEY: ${{ secrets.ARENA_API_KEY }}
          ARENA_API_BASE_URL: ${{ vars.ARENA_API_BASE_URL }}
        run: uv run python scripts/audit_availability.py --part catalog

      # An audit that measures and then discards its result is worse than
      # none (spec §8) -- a push failure here must redden the job, not be
      # swallowed. git pull --rebase + retry covers overlapping runs (the
      # 09:45/10:00 slots can collide under scheduler delay); the empty-diff
      # guard covers the (should-never-happen) case of no new rows.
      - name: Commit and push audit logs
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/

          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "data: availability audit run $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          for attempt in 1 2 3; do
            if git push; then
              echo "Push succeeded on attempt $attempt."
              exit 0
            fi
            echo "Push failed (attempt $attempt/3); pulling --rebase and retrying."
            git pull --rebase
          done

          echo "::error::Push failed after 3 attempts -- audit results were computed but not saved."
          exit 1
